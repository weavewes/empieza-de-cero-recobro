<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Simulador de canales · Recobro de honorarios · Empieza de Cero</title>
<style>
  :root{
    --ink:#1E2A4A; --muted:#5B6478; --line:#E4E8EF; --bg:#FBFBFD;
    --wire:#3B9CFF; --teal:#00A79A; --amber:#B96E12; --rose:#BE3F55; --blue:#3B9CFF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}

  .bar{position:fixed;inset:0 0 auto 0;height:52px;background:#fff;border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:14px;padding:0 16px;z-index:30}
  .tabs{display:flex;align-items:center;height:100%}
  .tab{padding:0 14px;height:100%;display:flex;align-items:center;font-size:14px;color:var(--muted);
       border-right:1px solid var(--line);text-decoration:none}
  .tab.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--blue)}
  .tab:hover{background:#F6F8FC}
  .spacer{flex:1}
  .title{font-size:12.5px;color:var(--muted)}
  .btn{border:0;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;
       font-family:inherit;line-height:1}
  .btn.pink{background:#E2456B}
  .btn.blue{background:#3B9CFF}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}

  #canvas{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;
    background-color:var(--bg);background-image:radial-gradient(#d7dde8 1px, transparent 1px);
    background-size:20px 20px}
  #canvas.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  #wires path{fill:none;stroke:var(--wire);stroke-width:2.4;pointer-events:stroke;cursor:pointer}
  #wires path.dash{stroke-dasharray:6 6;stroke-width:2}
  #wires path.temp{stroke-dasharray:5 5;stroke:#9AA6B8;pointer-events:none}
  #wires path:hover{stroke-width:3.6}

  .nd{position:absolute;width:244px;background:#fff;border-radius:8px;border:1px solid #EDF0F5;
      box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 14px rgba(16,24,40,.07);user-select:none;touch-action:none}
  .nd.sel{box-shadow:0 0 0 2px rgba(59,156,255,.55),0 6px 18px rgba(16,24,40,.12)}
  .nd-h{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;cursor:grab}
  .nd-h:active{cursor:grabbing}
  .nd-h .ic{font-size:13px;line-height:1}
  .nd-h .tt{font-size:13px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
  .nd-b{padding:0 12px 10px;font-size:11.6px;color:var(--muted);line-height:1.4}
  .nd-b .kv{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0}
  .nd-b .kv b{font-weight:600;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:9.6px;padding:2px 5px;border-radius:4px;background:#F2F5FA;color:#4A5568;border:1px solid #E4E9F2}
  .prev{margin-top:7px;padding-top:7px;border-top:1px dashed #E4E9F2;font-size:11px;color:#5B6478;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .see{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;color:#2F80ED;
       background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-weight:600}
  .see:hover{text-decoration:underline}

  .t-trigger{border-left:3px solid #7B61FF}
  .t-adm{border-left:3px solid var(--teal)}
  .t-gate{border-left:3px solid var(--rose)}
  .t-rec{border-left:3px solid var(--amber)}
  .t-out{border-left:3px solid var(--blue)}
  .t-sys{border-left:3px solid #9AA6B8}

  .port{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #C6CEDA;
        box-shadow:0 0 0 2px #fff;z-index:3}
  .port.in{left:-6px;top:50%;transform:translateY(-50%)}
  .port.out.r{right:-6px;cursor:crosshair;border-color:#3B9CFF}
  .port.out.b{left:50%;bottom:-6px;transform:translateX(-50%);cursor:crosshair;border-color:#3B9CFF}
  .port:hover{background:#EAF4FF;border-color:#3B9CFF}
  .plbl{position:absolute;font-size:9.6px;color:#7C8698;pointer-events:none;white-space:nowrap}
  .plbl.r{right:11px}
  .plbl.b{left:50%;transform:translateX(-50%);bottom:-19px;background:#fff;padding:0 4px;border-radius:3px}

  .zoom{position:fixed;right:16px;bottom:16px;display:flex;gap:6px;z-index:30}
  .zoom .btn{width:36px;height:34px;padding:0;display:grid;place-items:center;font-size:15px;
    background:#fff;border:1px solid var(--line);color:var(--ink)}
  .toast{position:fixed;left:50%;top:66px;transform:translateX(-50%);background:#1E2A4A;color:#fff;
    font-size:12.5px;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
  .toast.on{opacity:1}

  .drawer{position:fixed;top:52px;right:0;bottom:0;width:430px;max-width:92vw;background:#fff;
    border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(16,24,40,.08);
    transform:translateX(102%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dw-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .dw-h .code{font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff;background:#1E2A4A;
    border-radius:5px;padding:3px 7px;margin-top:2px}
  .dw-h .tt{font-size:15px;font-weight:650;line-height:1.3}
  .dw-h .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .dw-x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px}
  .dw-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0}
  .dw-tab{font-size:11.5px;border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:4px 8px;border-radius:5px;cursor:pointer;font-family:inherit}
  .dw-tab.on{border-color:#3B9CFF;color:#2F80ED;font-weight:600;background:#F4F9FF}
  .dw-meta{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px;font-size:11.5px;color:var(--muted);
    border-bottom:1px solid var(--line)}
  .dw-meta b{color:var(--ink);font-weight:600}
  .dw-body{flex:1;overflow:auto;padding:16px 18px 20px}
  .dw-body pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:13px;
    line-height:1.55;color:var(--ink)}
  .dw-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FBFCFE}

  @media (max-width:820px){ .title{display:none} }

  /* iconos de canal dentro de los nodos */
  svg.ci{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chipch{display:inline-flex;align-items:center;gap:5px;font-size:9.6px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:2px 6px;border-radius:999px;border:1px solid;margin-bottom:5px}
  .b-rec .chipch{color:#00796F;border-color:#A9DDD7;background:#fff}
  .b-imp .chipch{color:#BE3F55;border-color:#EDB9C3;background:#fff}
  /* dos familias de color: recordatorio (teal) e impago (rose) */
  .nd.b-rec{background:#F2FBFA;border-color:#BFE6E1}
  .nd.b-imp{background:#FDF1F3;border-color:#EDC3CC}
  .nd.b-rec .nd-h .tt{color:#00655C}
  .nd.b-imp .nd-h .tt{color:#A5304A}
  /* banda de frontera */
  .nd.frontier{width:2380px;background:#fff;border:2px dashed #BE3F55;border-radius:12px;
    box-shadow:none;padding:14px 20px;display:flex;align-items:center;gap:12px;color:#BE3F55;font-weight:650}
  .nd.frontier .ft{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8B95A6}
  .nd.frontier .fx{font-size:16px}
</style>
</head>

<script>
(function(){
  "use strict";
  const W = 244;
  const canvas = document.getElementById('canvas');
  const world  = document.getElementById('world');
  const svg    = document.getElementById('wires');
  const KEY    = 'edc-recobro-canales-v1';

  /* ---------- textos de los mensajes (documento maestro) ---------- */
  const CUENTA = '[datos de cuenta del despacho · omitidos en la versión pública]';

  const MSG = {
    T1:{titulo:'Cuota pendiente · estado de cuenta', nivel:'Servicio · sin plazo', desde:'administracion@empiezadecero.legal', plazo:'Sin plazo',
      texto:`Hola {NOMBRE}:

Te escribimos de Empieza de Cero. La cuota de {MES} de tu expediente figura pendiente por importe de {IMPORTE} €.

Puedes abonarla aquí: {ENLACE}

Si ya la has abonado, ignora este mensaje. Si necesitas ajustar el importe o la fecha, responde a este mensaje y lo vemos.

${CUENTA}`},
    T1b:{titulo:'Recordatorio corto (SMS)', nivel:'Servicio · sin plazo', desde:'SMS', plazo:'Sin plazo',
      texto:`Empieza de Cero: cuota de {MES} pendiente ({IMPORTE} €). Pago: {ENLACE} . Si ya pagó, ignórelo.`},
    T2:{titulo:'Estado de cuenta (email)', nivel:'Servicio · sin plazo', desde:'administracion@empiezadecero.legal', plazo:'Sin plazo',
      texto:`Hola {NOMBRE}:

Adjuntamos el estado de cuenta de tu expediente. La cuota de {MES} sigue pendiente por {IMPORTE} €.

Puedes pagar en {ENLACE} o responder a este correo si prefieres ajustar el importe o las fechas.

Si el pago ya se ha realizado, responde con el justificante y lo comprobamos.

${CUENTA}`},
    T3:{titulo:'Segundo aviso de servicio', nivel:'Servicio · sin plazo', desde:'administracion@empiezadecero.legal', plazo:'Sin plazo',
      texto:`Hola {NOMBRE}:

Revisamos tu expediente y la cuota de {MES} sigue pendiente por {IMPORTE} €.

Si necesitas ajustar el importe o la fecha, responde a este mensaje. Si ya la has abonado, envíanos el justificante.

${CUENTA}`},
    M1:{titulo:'Aviso de regularización', nivel:'Nivel I · 1 cuota', desde:'administracion@empiezadecero.legal', plazo:'5 días',
      texto:`Estimado/a {NOMBRE}:

Hemos comprobado que actualmente consta una cuota vencida y pendiente de pago por importe de {IMPORTE} €, correspondiente a los servicios profesionales de su expediente.

Le requerimos para que proceda a su regularización antes del {FECHA}.

Nuestro objetivo es mantener su expediente económicamente al corriente y evitar que el impago continúe acumulándose.

Si ya hubiera realizado el pago, remita el justificante para su inmediata comprobación.

${CUENTA} · Concepto: Expediente {EXPEDIENTE}`},

    M2:{titulo:'Requerimiento de regularización', nivel:'Nivel II · 2 cuotas', desde:'administracion@empiezadecero.legal', plazo:'5 días',
      texto:`Estimado/a {NOMBRE}:

A fecha de hoy constan dos cuotas vencidas y pendientes de pago, por importe total de {IMPORTE} €.

La situación ha dejado de ser un retraso aislado y requiere una regularización inmediata.

Antes del {FECHA} deberá abonar la deuda o formular una propuesta concreta de pago. La propuesta deberá indicar importe de pago inicial y fechas determinadas para el resto.

No se considerarán válidos compromisos indeterminados o sin fecha.

${CUENTA} · Concepto: Expediente {EXPEDIENTE}`},

    M3:{titulo:'Último aviso administrativo', nivel:'Nivel III · 3 cuotas', desde:'administracion@empiezadecero.legal', plazo:'5 días',
      texto:`Estimado/a {NOMBRE}:

Su expediente acumula actualmente tres cuotas vencidas y pendientes de pago, por importe total de {IMPORTE} €.

La situación constituye ya un incumplimiento reiterado de las obligaciones económicas asumidas con Empieza de Cero.

Le requerimos para que regularice íntegramente la deuda antes del {FECHA}, o formalice dentro de ese plazo una propuesta de pago concreta y expresamente aceptada por el despacho.

En ausencia de pago o acuerdo formal, la deuda dejará de gestionarse como una incidencia administrativa ordinaria y pasará a recuperación formal.

No se admitirán nuevas promesas de pago carentes de importe y fecha.

${CUENTA} · Concepto: Expediente {EXPEDIENTE}`},

    M4:{titulo:'Requerimiento formal · sin demanda', nivel:'Nivel IV · más de 3 cuotas', desde:'recuperaciones@empiezadecero.legal', plazo:'10 días',
      texto:`Estimado/a {NOMBRE}:

Su expediente acumula {NÚMERO_CUOTAS} cuotas vencidas e impagadas, por importe total de {IMPORTE} €.

El incumplimiento es grave y reiterado y resulta incompatible con el mantenimiento ordinario de las actuaciones profesionales.

LE REQUERIMOS FORMALMENTE para que proceda al pago íntegro de la deuda antes del {FECHA}.

De no producirse la regularización, quedarán bloqueadas nuevas actuaciones y podrán suspenderse aquellas actuaciones preparatorias que legal y deontológicamente puedan condicionarse al pago. Asimismo, podrá procederse al archivo del expediente y a la resolución de la relación contractual cuando corresponda.

Los honorarios ya devengados serán reclamados. Cuando concurran los requisitos legales, la reclamación podrá ejercitarse mediante procedimiento monitorio o por la vía declarativa que corresponda. Si la reclamación civil exige actividad negociadora previa, se realizará la correspondiente solicitud de negociación de forma documentada antes de presentar la demanda.

No se concederán nuevas prórrogas informales.

${CUENTA} · Concepto: Honorarios-Expediente {EXPEDIENTE}`},

    M5:{titulo:'Requerimiento formal · demanda presentada', nivel:'Nivel IV · más de 3 cuotas', desde:'recuperaciones@empiezadecero.legal', plazo:'10 días',
      texto:`Estimado/a {NOMBRE}:

Pese a encontrarse su procedimiento ya judicializado, mantiene con Empieza de Cero {NÚMERO_CUOTAS} cuotas vencidas e impagadas, por importe total de {IMPORTE} €.

La presentación de la demanda no suspende ni extingue las obligaciones económicas asumidas con el despacho.

LE REQUERIMOS FORMALMENTE para que proceda al pago íntegro de la deuda antes del {FECHA}.

En ausencia de pago se bloqueará la asunción de nuevas actuaciones no imprescindibles que puedan condicionarse a regularización, podrán exigirse provisiones para actuaciones extraordinarias y se revisará jurídicamente la continuidad de la relación profesional sin causar indefensión.

Las cantidades vencidas y exigibles serán reclamadas por la vía judicial procedente, incluida la vía monitoria cuando concurran sus requisitos.

La judicialización de su expediente no convierte en voluntario el pago de los servicios contratados.

${CUENTA} · Concepto: Honorarios-Expediente {EXPEDIENTE}`},

    M6:{titulo:'Requerimiento formal · auto de apertura', nivel:'Nivel IV · más de 3 cuotas', desde:'recuperaciones@empiezadecero.legal', plazo:'10 días',
      texto:`Estimado/a {NOMBRE}:

Su procedimiento concursal se encuentra ya declarado y, pese a ello, mantiene {NÚMERO_CUOTAS} cuotas vencidas e impagadas, por importe total de {IMPORTE} €.

El incumplimiento es grave y reiterado.

LE REQUERIMOS FORMALMENTE para que abone íntegramente la deuda antes del {FECHA}.

El expediente quedará bloqueado para nuevas actuaciones profesionales no imprescindibles que legalmente puedan condicionarse al pago y podrá exigirse provisión previa para nuevas incidencias o actuaciones extraordinarias.

Si Jurídico ha validado que los honorarios reúnen los requisitos del artículo 242.1.6.º TRLC, se solicitará su reconocimiento y pago como crédito contra la masa. En caso de controversia sobre el reconocimiento o pago, se ejercitarán las acciones correspondientes ante el juez del concurso por los trámites del incidente concursal. Si dicha calificación no procede, se reclamará la deuda por la vía legalmente aplicable.

No se continuará generando nueva deuda sin regularización.

${CUENTA} · Concepto: Honorarios-Expediente {EXPEDIENTE}`},

    M7:{titulo:'Requerimiento formal · EPI en tramitación', nivel:'Nivel IV · más de 3 cuotas', desde:'recuperaciones@empiezadecero.legal', plazo:'10 días',
      texto:`Estimado/a {NOMBRE}:

Su procedimiento se encuentra en fase de Exoneración del Pasivo Insatisfecho y mantiene con Empieza de Cero {NÚMERO_CUOTAS} cuotas vencidas, por importe total de {IMPORTE} €.

La tramitación de la EPI no suspende por sí sola la obligación de atender aquellos honorarios profesionales que continúen siendo exigibles.

LE REQUERIMOS FORMALMENTE para que regularice íntegramente la deuda antes del {FECHA}.

En ausencia de pago se bloquearán nuevas actuaciones extraordinarias que legalmente puedan condicionarse a provisión o regularización y se procederá a reclamar las cantidades exigibles por la vía validada por Jurídico.

Cuando proceda su calificación como crédito contra la masa, se utilizará la vía concursal correspondiente; en otro caso, se utilizará la vía judicial aplicable.

La proximidad de la resolución de exoneración no legitima la acumulación de deuda frente al despacho.

${CUENTA} · Concepto: Honorarios-Expediente {EXPEDIENTE}`},

    M8:{titulo:'Requerimiento formal · plan de pagos', nivel:'Nivel IV · más de 3 cuotas', desde:'recuperaciones@empiezadecero.legal', plazo:'10 días',
      texto:`Estimado/a {NOMBRE}:

  function preview(n){
    if(!n.msg) return '';
    const first=MSG[n.msg[0]];
    const clean=first.texto.replace(/^Estimado\/a \{NOMBRE\}:\s*/,'').replace(/\s+/g,' ').slice(0,132);
    const extra=n.msg.length>1?' <span style="color:#9AA3B2">· '+n.msg.length+' variantes</span>':'';
    return '<div class="prev">“'+clean+'…”'+extra+'</div>'+
           '<button class="see" data-msg="'+n.msg.join(',')+'">Ver el texto completo →</button>';
  }

  function nodeHTML(n){
    if(n.cls==='frontier'){
      return '<div style="display:flex;align-items:center;gap:14px">'+
             '<svg class="ci" style="width:22px;height:22px"><use href="#i-alert"/></svg>'+
             '<div><div class="ft">'+n.title+'</div><div class="fx">'+n.body+'</div></div></div>';
    }
    const outs=n.outs||[{l:'',s:'r'}];
    const right=outs.filter(o=>o.s==='r'), bottom=outs.find(o=>o.s==='b');
    let ports='<i class="port in"></i>', labels='';
    right.forEach((o,i)=>{
      const top = right.length===1 ? 50 : (right.length===2 ? (i===0?38:68) : (i===0?26:(i===1?50:74)));
      ports += '<i class="port out r" data-oi="'+outs.indexOf(o)+'" style="top:'+top+'%"></i>';
      if(o.l) labels += '<span class="plbl r" style="top:calc('+top+'% - 15px)">'+o.l+'</span>';
    });
    if(bottom){
      ports += '<i class="port out b" data-oi="'+outs.indexOf(bottom)+'"></i>';
      if(bottom.l) labels += '<span class="plbl b">'+bottom.l+'</span>';
    }
    const CH = {wa:'WhatsApp',sms:'SMS',smscert:'SMS certificado',mail:'Email',cert:'Email certificado',call:'Llamada',bot:'Bot de voz',shield:'Jurídico',flag:'Cierre',stop:'Parada',doc:'Expediente',alert:'Alerta',clock:'Espera'};
    const head = n.ch ? '<svg class="ci"><use href="#i-'+n.ch+'"/></svg>' : '<span class="ic">'+(n.icon||'')+'</span>';
    const chip = n.ch ? '<span class="chipch"><svg class="ci" style="width:11px;height:11px"><use href="#i-'+n.ch+'"/></svg>'+(CH[n.ch]||n.ch)+'</span>' : '';
    const body = chip+(n.body||'')+preview(n);
    return '<div class="nd-h">'+head+'<span class="tt">'+n.title+'</span></div>'+
           (body?'<div class="nd-b">'+body+'</div>':'')+ports+labels;
  }

  function render(){
    [...world.querySelectorAll('.nd')].forEach(e=>e.remove());
    nodes.forEach(n=>{
      const el=document.createElement('div');
      el.className='nd '+n.cls; el.dataset.id=n.id;
      el.style.left=n.x+'px'; el.style.top=n.y+'px';
      el.innerHTML=nodeHTML(n);
      world.appendChild(el); n.el=el;
    });
    drawWires();
  }

  function pt(n,oi){
    const p=n.el.querySelector('.port.out[data-oi="'+oi+'"]');
    if(!p) return {x:n.x+W,y:n.y+30,side:'r'};
    return {x:n.x+p.offsetLeft+p.offsetWidth/2, y:n.y+p.offsetTop+p.offsetHeight/2,
            side:p.classList.contains('b')?'b':'r'};
  }

  function drawWires(){
    const out=[];
    links.forEach((l,i)=>{
      const a=nodes.find(n=>n.id===l.from), b=nodes.find(n=>n.id===l.to);
      if(!a||!b||!a.el||!b.el) return;
      const p1=pt(a,l.oi||0);
      const x2=b.x, y2=b.y+b.el.offsetHeight/2;
      let d;
      if(p1.side==='b'){
        const dy=Math.max(40,Math.abs(y2-p1.y)/2);
        d='M'+p1.x+','+p1.y+' C'+p1.x+','+(p1.y+dy)+' '+x2+','+(y2-dy)+' '+x2+','+y2;
      } else {
        const dx=Math.max(50,Math.abs(x2-p1.x)/2);
        d='M'+p1.x+','+p1.y+' C'+(p1.x+dx)+','+p1.y+' '+(x2-dx)+','+y2+' '+x2+','+y2;
      }
      out.push('<path data-i="'+i+'" class="'+(l.dash?'dash':'')+'" d="'+d+'"/>');
    });
    svg.innerHTML=out.join('');
  }

  function apply(){ world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.z+')'; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify({
    nodes:nodes.map(n=>({id:n.id,x:n.x,y:n.y,title:n.title,icon:n.icon,cls:n.cls,body:n.body,outs:n.outs,msg:n.msg})),
    links,view,seq})); }catch(e){} }
  function load(){ try{ const raw=localStorage.getItem(KEY); if(!raw) return false;
    const s=JSON.parse(raw); if(!s||!s.nodes||!s.nodes.length) return false;
    nodes=s.nodes; links=s.links||[]; view=s.view||view; seq=s.seq||nodes.length+1; return true; }catch(e){ return false; } }

  let drag=null;
  canvas.addEventListener('pointerdown',e=>{
    if(e.target.closest('.nd')||e.target.closest('.drawer')) return;
    canvas.classList.add('grabbing');
    drag={mode:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y};
    canvas.setPointerCapture(e.pointerId);
  });

  world.addEventListener('pointerdown',e=>{
    const outEl=e.target.closest('.port.out'), head=e.target.closest('.nd-h'), nodeEl=e.target.closest('.nd');
    if(!nodeEl) return;
    if(outEl){
      const n=nodes.find(x=>x.id===nodeEl.dataset.id), p=pt(n,+outEl.dataset.oi);
      drag={mode:'link',from:n.id,oi:+outEl.dataset.oi,x1:p.x,y1:p.y,side:p.side};
      e.stopPropagation(); return;
    }
    if(head){
      const n=nodes.find(x=>x.id===nodeEl.dataset.id);
      document.querySelectorAll('.nd.sel').forEach(el=>el.classList.remove('sel'));
      nodeEl.classList.add('sel');
      drag={mode:'node',n,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y};
      e.stopPropagation();
    }
  });

  window.addEventListener('pointermove',e=>{
    if(!drag) return;
    if(drag.mode==='pan'){ view.x=drag.ox+(e.clientX-drag.sx); view.y=drag.oy+(e.clientY-drag.sy); apply(); return; }
    if(drag.mode==='node'){
      drag.n.x=drag.ox+(e.clientX-drag.sx)/view.z; drag.n.y=drag.oy+(e.clientY-drag.sy)/view.z;
      drag.n.el.style.left=drag.n.x+'px'; drag.n.el.style.top=drag.n.y+'px'; drawWires(); return;
    }
    if(drag.mode==='link'){
      const r=canvas.getBoundingClientRect();
      const x=(e.clientX-r.left-view.x)/view.z, y=(e.clientY-r.top-view.y)/view.z;
      let d;
      if(drag.side==='b'){ const dy=Math.max(40,Math.abs(y-drag.y1)/2);
        d='M'+drag.x1+','+drag.y1+' C'+drag.x1+','+(drag.y1+dy)+' '+x+','+(y-dy)+' '+x+','+y; }
      else { const dx=Math.max(50,Math.abs(x-drag.x1)/2);
        d='M'+drag.x1+','+drag.y1+' C'+(drag.x1+dx)+','+drag.y1+' '+(x-dx)+','+y+' '+x+','+y; }
      svg.innerHTML='<path class="temp" d="'+d+'"/>';
    }
  });

  window.addEventListener('pointerup',e=>{
    if(!drag) return;
    if(drag.mode==='link'){
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const inPort=t&&t.classList&&t.classList.contains('in')?t:null;
      const nodeEl=inPort?inPort.closest('.nd'):null;
      if(nodeEl){
        const to=nodeEl.dataset.id;
        if(!links.some(l=>l.from===drag.from&&l.to===to&&l.oi===drag.oi)){
          links.push({from:drag.from,to,oi:drag.oi,dash:false}); save(); drawWires(); toast('Conexión creada');
        }
      } else drawWires();
    }
    if(drag.mode==='pan') canvas.classList.remove('grabbing');
    if(drag.mode==='node') save();
    drag=null;
  });

  world.addEventListener('contextmenu',e=>{
    const nodeEl=e.target.closest('.nd'); if(!nodeEl) return;
    e.preventDefault();
    const id=nodeEl.dataset.id;
    nodes=nodes.filter(n=>n.id!==id); links=links.filter(l=>l.from!==id&&l.to!==id);
    nodeEl.remove(); drawWires(); save(); toast('Nodo eliminado');
  });
  svg.addEventListener('contextmenu',e=>{
    const p=e.target.closest('path[data-i]'); if(!p) return;
    e.preventDefault(); links.splice(+p.dataset.i,1); drawWires(); save(); toast('Conexión eliminada');
  });

  function zoomAt(f,cx,cy){
    const z2=Math.min(1.8,Math.max(.25,view.z*f));
    const r=canvas.getBoundingClientRect();
    const px=(cx!==undefined?cx-r.left:r.width/2), py=(cy!==undefined?cy-r.top:r.height/2);
    view.x=px-(px-view.x)*(z2/view.z); view.y=py-(py-view.y)*(z2/view.z);
    view.z=z2; apply(); save();
  }
  document.getElementById('zo').onclick=()=>zoomAt(1/1.18);
  document.getElementById('zp').onclick=()=>zoomAt(1.18);
  document.getElementById('zf').onclick=fit;
  canvas.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){ e.preventDefault(); zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY); return; }
    e.preventDefault();
    if(e.shiftKey){ view.y-=e.deltaY; }
    else { view.x-=e.deltaY; view.x-=e.deltaX; }
    apply();
  },{passive:false});

  function fit(){
    if(!nodes.length) return;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    nodes.forEach(n=>{ const h=n.el?n.el.offsetHeight:110;
      x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+W); y1=Math.max(y1,n.y+h); });
    const r=canvas.getBoundingClientRect();
    const z=Math.min(1.25,Math.max(.25,Math.min((r.width-80)/(x1-x0),(r.height-80)/(y1-y0))));
    view.z=z; view.x=40-x0*z; view.y=36-y0*z; apply(); save();
  }

  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1500); }

  document.getElementById('reset').onclick=()=>{
    localStorage.removeItem(KEY); seq=1;
    const d=defaults(); nodes=d.nodes; links=d.links;
    render(); view={x:40,y:40,z:0.78}; apply(); save(); toast('Flujo restaurado');
  };
  document.getElementById('clear').onclick=()=>{ nodes=[]; links=[]; render(); save(); toast('Lienzo vacío'); };
  document.getElementById('export').onclick=()=>{
    const data={generado:new Date().toISOString(),
      nodos:nodes.map(n=>({titulo:n.title,tipo:n.cls.replace('t-',''),mensaje:n.msg||null,x:Math.round(n.x),y:Math.round(n.y)})),
      conexiones:links.map(l=>{const a=nodes.find(n=>n.id===l.from),b=nodes.find(n=>n.id===l.to);
        return {desde:a?a.title:l.from,salida:(a&&a.outs&&a.outs[l.oi]&&a.outs[l.oi].l)||l.oi,
                hacia:b?b.title:l.to,condicional:!!l.dash};}),
      mensajes:Object.keys(MSG).reduce((o,k)=>{o[k]={asunto:MSG[k].titulo,desde:MSG[k].desde,plazo:MSG[k].plazo,texto:MSG[k].texto};return o;},{})};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='flujo-recobro-kommo.json'; a.click(); URL.revokeObjectURL(a.href); toast('JSON exportado');
  };

    const b=e.target.closest('.dw-tab'); if(!b) return; curI=+b.dataset.i; showMsg();
  });
  document.addEventListener('click',e=>{
    const see=e.target.closest('.see');
    if(see){ e.stopPropagation(); openMsg(see.dataset.msg.split(',')); }
  });
  document.getElementById('dwCopy').onclick=async()=>{
    const txt=MSG[cur[curI]].texto;
    try{ await navigator.clipboard.writeText(txt); toast('Texto copiado'); }
    catch(err){
      const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); toast('Texto copiado');
    }
  };
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMsg(); });

  const restored=load();
  if(!restored){ const d=defaults(); nodes=d.nodes; links=d.links; }
  render();
  if(restored){ apply(); } else { fit(); }
  window.addEventListener('resize',()=>drawWires());
})();
</script>
</body>
</html>
